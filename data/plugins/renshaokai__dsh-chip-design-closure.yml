url: https://github.com/renshaokai/dsh-chip-design-closure
name: renshaokai/dsh-chip-design-closure
category: dev
description:
  en: 'Adds a design-closure agent preset for digital chip front-end work: architecture and budget exploration, design specs written forward or reverse-engineered from existing RTL, functional-point and acceptance-observation-point lists handed to verification, RTL, lint/CDC, synthesis and timing closure, PPA and SoC integration. Ships the chip-design skill (eight-chapter spec outline, review checklist, spec template) and three scripts: a 38-rule spec linter, a Markdown to docx/PDF converter that writes a Word table of contents, and a draw.io / Mermaid / WaveDrom figure renderer.'
  zh: '为 DSH 增加「设计收口」专家预设：架构与预算探索、设计规格（正向编写或从已有 RTL 反向回填）、交接给验证的功能点与验收观察点清单、RTL、lint/CDC、逻辑综合与时序收敛、PPA 优化、SoC 集成。附带 chip-design 技能（八章规格大纲、评审清单、规格模板）与三个脚本：38 条规则的规格校验、带 Word 自动目录的 Markdown 转 docx/PDF、draw.io / Mermaid / WaveDrom 出图。'
